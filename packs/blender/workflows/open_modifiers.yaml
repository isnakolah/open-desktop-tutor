id: blender.workflow.open_modifier_properties
title: Open Modifier Properties
aliases: [open modifiers, find the wrench tab]
app_versions: ">=5.2 <5.3"
source_refs: [open-tutor-authored]
goal: Make the Modifier Properties context visible for the active object.
steps:
  - instruction: Find the Properties editor on the right.
    target: blender.ui.properties_editor
  - instruction: Open the wrench-shaped Modifier Properties tab.
    target: blender.ui.properties.modifiers_tab
success:
  detector: blender.detector.properties_context_is_modifier
