[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-desktop-tutor"
version = "0.0.1"
description = "Teaching-first desktop application tutor and App Pack toolchain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.10,<5",
]

[project.scripts]
open-tutor-pack = "open_tutor_pack.cli:main"

[tool.setuptools]
package-dir = {"" = "tools/packctl/src"}

[tool.setuptools.packages.find]
where = ["tools/packctl/src"]
